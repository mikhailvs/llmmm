[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "epicure"
version = "0.2.0"
description = "Offline ingredient pairing and recipe generation from food embeddings"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
epicure = "epicure:main"

[tool.setuptools]
py-modules = ["epicure"]
